  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% - 44px);top:calc(50% - 36px);width:6px;height:6px;border-radius:50%;background:#cfe0ff;box-shadow:0 0 9px #7fc4ff;animation:float 5.6s ease-in-out infinite;animation-delay:.8s;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q17 no sound in vacuum: ear + music notes fading, no-symbol -->\n          <sc-if value=\"{{ q17 }}\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\">\n              <!-- ear -->\n              <svg viewBox=\"0 0 64 64\" style=\"position:absolute;left:calc(50% - 58px);top:50%;transform:translateY(-50%);width:74px;height:74px;overflow:visible;\">\n                <path d=\"M22 54 C16 46 14 42 14 30 C14 16 24 8 34 8 C46 8 52 17 52 27 C52 36 46 39 41 41 C37 43 35 45 35 49 C35 54 31 57 27 57 C24 57 22 56 22 54 Z\" fill=\"none\" stroke=\"#cdd6ec\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath>\n                <path d=\"M26 30 C26 23 31 19 35 20 C40 21 41 27 38 30 C35 33 33 34 33 39\" fill=\"none\" stroke=\"#9fb0d6\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n              <\u002Fsvg>\n              <!-- music notes drifting toward ear, fading -->\n              <div style=\"position:absolute;left:calc(50% + 6px);top:calc(50% - 30px);font-size:30px;color:#7fc4ff;opacity:.85;animation:float 4s ease-in-out infinite;text-shadow:0 0 14px rgba(127,196,255,.6);\">♪<\u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% + 40px);top:calc(50% + 6px);font-size:24px;color:#5e8fd6;opacity:.5;animation:float 5s ease-in-out infinite;animation-delay:.6s;\">♫<\u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% + 30px);top:calc(50% - 6px);font-size:18px;color:#4a6aa8;opacity:.3;animation:float 6s ease-in-out infinite;animation-delay:1.1s;\">♩<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q18 blue sky: Rayleig us:50%;background:#cfe6ff;box-shadow:0 0 9px #6fb6ff;animation:twinkle 2.8s ease-in-out infinite;animation-delay:1.4s;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q19 spacecraft graveyard: Point Nemo, debris falling into ocean -->\n          <sc-if value=\"{{ q19 }}\">\n            <div style=\"position:absolute;inset:0;overflow:hidden;\">\n              <div style=\"position:absolute;left:50%;bottom:-180px;transform:translateX(-50%);width:520px;height:300px;border-radius:50%;background:radial-gradient(circle at 50% 0%,#1d6a8f,#0d3a5e 55%,#06223c);box-shadow:0 -8px 50px rgba(40,120,180,.35);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:34px;height:34px;\">\n                <div style=\"position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(180,225,255,.7);\"><\u002Fdiv>\n                <div style=\"position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#bfe6ff;transform:translate(-50%,-50%);box-shadow:0 0 10px #7fc4ff;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% - 4px);top:26px;width:10px;height:10px;border-radius:2px;background:#cdd6ec;box-shadow:0 0 12px #ffb070;animation:fall 2.6s ease-in infinite;\"><\u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% + 22px);top:16px;width:7px;height:7px;border-radius:2px;background:#aeb9d4;box-shadow:0 0 10px #ff9a5a;animation:fall 3.2s ease-in infinite;animation-delay:1s;\"><\u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% - 28px);top:20px;width:6px;height:6px;border-radius:2px;background:#c7d0e6;box-shadow:0 0 9px #ffa060;animation:fall 3s ease-in infinite;animation-delay:1.7s;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q20 Mercury: hot day side, cold night side, heat escaping -->\n          <sc-if value=\"{{ q20 }}\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\">\n              <div style=\"position:absolute;left:calc(50% - 118px);top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd24b 55%,#ff8a3c);box-shadow:0 0 50px rgba(255,190,90,.8);\"><\u002Fdiv>\n              <div style=\"position:absolute;width:112px;height:112px;border-radius:50%;overflow:hidden;background:linear-gradient(90deg,#e8a24c 0%,#b06a2e 38%,#3a4660 62%,#10182e 100%);box-shadow:0 0 40px rgba(120,90,160,.3),inset -10px -8px 26px rgba(0,0,0,.6);\">\n                <div style=\"position:absolute;top:30%;left:22%;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 60% 60%,rgba(0,0,0,.35),transparent 70%);\"><\u002Fdiv>\n                <div style=\"position:absolute;top:58%;left:30%;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 60% 60%,rgba(0,0,0,.3),transparent 70%);\"><\u002Fdiv>\n                <div style=\"position:absolute;top:44%;left:64%;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 60% 60%,rgba(255,255,255,.06),transparent 70%);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% + 46px);top:calc(50% - 22px);width:5px;height:18px;border-radius:3px;background:linear-gradient(transparent,rgba(160,190,255,.5));animation:beam 1.6s ease-in-out infinite;filter:blur(1px);\"><\u002Fdiv>\n              <div style=\"position:absolute;left:calc(50% + 54px);top:calc(50% + 6px);width:5px;height:16px;border-radius:3px;background:linear-gradient(transparent,rgba(160,190,255,.45));animation:beam 1.9s ease-in-out infinite;animation-delay:.5s;filter:blur(1px);\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q21 ion drive: probe with blue ion beam -->\n          <sc-if value=\"{{ q21 }}\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\">\n              <div style=\"position:absolute;display:flex;align-items:center;animation:float 5s ease-in-out infinite;\">\n                <div style=\"width:124px;height:26px;background:linear-gradient(90deg,rgba(120,200,255,0),rgba(120,200,255,.65) 58%,rgba(190,238,255,.95));border-radius:50% 6px 6px 50%;filter:blur(2px);animation:beam 1.4s ease-in-out infinite;\"><\u002Fdiv>\n                <div style=\"width:10px;height:18px;background:#8a93ad;border-radius:2px;\"><\u002Fdiv>\n                <div style=\"position:relative;width:34px;height:30px;border-radius:5px;background:linear-gradient(90deg,#aeb6cc,#eef2fb 50%,#aeb6cc);box-shadow:0 0 16px rgba(120,170,255,.4);\">\n                  <div style=\"position:absolute;left:50%;top:-17px;transform:translateX(-50%);width:15px;height:14px;background:repeating-linear-gradient(0deg,#2a52b8 0 3px,#6f9fff 3px 4px);border:1px solid #6f9fff;\"><\u002Fdiv>\n                  <div style=\"position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);width:15px;height:14px;background:repeating-linear-gradient(0deg,#2a52b8 0 3px,#6f9fff 3px 4px);border:1px solid #6f9fff;\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q22 PW-Sat 2012 launch: CubeSat + Polish flag + year badge rising -->\n          <sc-if value=\"{{ q22 }}\">\n            <div style=\"position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;\">\n              <div style=\"position:absolute;display:flex;flex-direction:column;align-items:center;animation:rise 4s ease-in infinite;\">\n                <div style=\"position:relative;width:40px;height:40px;border-radius:5px;background:linear-gradient(135deg,#cdd6ec,#eef2fb 50%,#aeb6cc);box-shadow:0 0 18px rgba(120,170,255,.4);overflow:hidden;\">\n                  <div style=\"position:absolute;top:0;left:0;width:100%;height:50%;background:#f4f4f4;\"><\u002Fdiv>\n                  <div style=\"position:absolute;top:50%;left:0;width:100%;height:50%;background:#dc143c;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:absolute;left:-22px;top:6px;width:18px;height:28px;background:repeating-linear-gradient(0deg,#2a52b8 0 3px,#6f9fff 3px 4px);border:1px solid #6f9fff;\"><\u002Fdiv>\n                <div style=\"position:absolute;right:-22px;top:6px;width:18px;height:28px;background:repeating-linear-gradient(0deg,#2a52b8 0 3px,#6f9fff 3px 4px);border:1px solid #6f9fff;\"><\u002Fdiv>\n                <div style=\"width:18px;height:30px;margin-top:-2px;background:linear-gradient(#fff3c0,#ff8a3c 55%,transparent);border-radius:0 0 50% 50%;animation:flame .22s infinite alternate;filter:blur(.6px);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q23 PW-Sat2 deorbit sail: CubeSat with deployed square sail -->\n          <sc-if value=\"{{ q23 }}\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\">\n              <div style=\"position:absolute;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#5fa0ef,#1c3f9a 55%,#0a1d52);box-shadow:0 0 40px rgba(79,143,255,.35),inset -9px -7px 24px rgba(0,0,0,.5);bottom:-30px;left:calc(50% - 130px);\"><\u002Fdiv>\n              <div style=\"position:absolute;display:flex;flex-direction:column;align-items:center;animation:float 6s ease-in-out infinite;\">\n                <!-- sail -->\n                <div style=\"width:108px;height:108px;background:linear-gradient(135deg,rgba(190,225,255,.32),rgba(120,180,255,.14));border:1.5px solid rgba(160,210,255,.6);box-shadow:0 0 26px rgba(120,180,255,.4);position:relative;transform:perspective(360px) rotateX(14deg);\">\n                  <div style=\"position:absolute;top:0;left:50%;width:1px;height:100%;background:rgba(160,210,255,.5);transform:translateX(-50%);\"><\u002Fdiv>\n                  <div style=\"position:absolute;top:50%;left:0;width:100%;height:1px;background:rgba(160,210,255,.5);transform:translateY(-50%);\"><\u002Fdiv>\n                  <div style=\"position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);animation:glint 3.4s ease-in-out infinite;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <!-- cubesat body below sail -->\n                <div style=\"width:26px;height:26px;margin-top:8px;border-radius:4px;background:linear-gradient(135deg,#cdd6ec,#eef2fb 50%,#aeb6cc);box-shadow:0 0 14px rgba(120,170,255,.4);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- Q24 PW-Sat1 CubeSat 2U format: tall 2-unit cube with dimension markers -->\n          <sc-if value=\"{{ q24 }}\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\">\n              <div style=\"position:absolute;display:flex;align-items:center;gap:22px;animation:float 6s ease-in-out infinite;\">\n                <!-- solar panel -->\n                <div style=\"width:20px;height:84px;background:repeating-linear-gradient(0deg,#2a52b8 0 5px,#6f9fff 5px 6px);border:1px solid #6f9fff;\"><\u002Fdiv>\n                <!-- 2U body: two stacked units -->\n                <div style=\"position:relative;width:62px;height:124px;border-radius:6px;background:linear-gradient(135deg,#b8c2da,#eef2fb 50%,#9aa4bd);box-shadow:0 0 22px rgba(120,170,255,.4),inset -6px -6px 16px rgba(0,0,0,.25);\">\n                  <div style=\"position:absolute;top:50%;left:6px;right:6px;height:1.5px;background:rgba(40,60,110,.5);transform:translateY(-50%);\"><\u002Fdiv>\n                  <div style=\"position:absolute;top:14px;left:12px;width:38px;height:38px;border-radius:3px;background:repeating-linear-gradient(0deg,#2a52b8 0 4px,#6f9fff 4px 5px);border:1px solid #6f9fff;\"><\u002Fdiv>\n                  <div style=\"position:absolute;bottom:14px;left:12px;width:38px;height:38px;border-radius:3px;background:repeating-linear-gradient(0deg,#2a52b8 0 4px,#6f9fff 4px 5px);border:1px solid #6f9fff;\"><\u002Fdiv>\n                  <!-- 2U dimension bracket -->\n                  <div style=\"position:absolute;right:-26px;top:0;bottom:0;width:10px;border-top:1.5px solid #7fe3ff;border-right:1.5px solid #7fe3ff;border-bottom:1.5px solid #7fe3ff;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width:20px;height:84px;background:repeating-linear-gradient(0deg,#2a52b8 0 5px,#6f9fff 5px 6px);border:1px solid #6f9fff;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <button onclick=\"{{ goPrev }}\" class=\"q-arrow\" style=\"{{ prevStyle }}\" style-hover=\"background:rgba(79,160,255,.35)\" aria-label=\"Poprzednie pytanie\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#dfeaff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 5 8 12 15 19\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n          <button onclick=\"{{ goNext }}\" class=\"q-arrow\" style=\"{{ nextStyle }}\" style-hover=\"background:rgba(79,160,255,.35)\" aria-label=\"Następne pytanie\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#dfeaff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 5 16 12 9 19\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"q-kbd-hint\" style=\"text-align:center;font-size:12px;color:#5e6aa0;letter-spacing:.05em;margin-top:13px;\">Użyj strzałek ← → do nawigacji, klawiszy 1–4 lub A–D do odpowiedzi<\u002Fdiv>\n\n        <!-- question -->\n        <h2 class=\"q-h2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:29px;font-weight:600;line-height:1.25;letter-spacing:-.01em;margin:30px 0 22px;text-wrap:pretty;\">{{ question }}<\u002Fh2>\n\n        <!-- options -->\n        <div class=\"q-opts\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n          <sc-for list=\"{{ optionList }}\" as=\"opt\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ opt.onClick }}\" class=\"q-opt\" style=\"{{ opt.boxStyle }}\" style-hover=\"filter:brightness(1.12)\">\n              <span style=\"{{ opt.chipStyle }}\" class=\"q-opt-chip\">{{ opt.letter }}<\u002Fspan>\n              <span style=\"flex:1;font-size:17px;font-weight:500;line-height:1.32;\" class=\"q-opt-text\">{{ opt.text }}<\u002Fspan>\n              <span style=\"{{ opt.markStyle }}\">{{ opt.markChar }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- answer recorded → auto-advance; no feedback shown -->\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= RESULT ================= -->\n    <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;animation:fadein .55s ease;\">\n        <div class=\"q-result-ring\" style=\"position:relative;width:220px;height:220px;margin-top:8px;\">\n          <svg viewBox=\"0 0 160 160\" style=\"position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);\">\n            <circle cx=\"80\" cy=\"80\" r=\"70\" fill=\"none\" stroke=\"rgba(255,255,255,.08)\" stroke-width=\"10\"><\u002Fcircle>\n            <circle cx=\"80\" cy=\"80\" r=\"70\" fill=\"none\" stroke=\"#4fd6ff\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"440\" stroke-dashoffset=\"{{ ringOffset }}\" style=\"filter:drop-shadow(0 0 8px rgba(79,214,255,.7));animation:scoredraw 1.1s ease-out;\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Space Grotesk',sans-serif;font-size:58px;font-weight:700;line-height:1;\">{{ score }}<\u002Fdiv>\n          <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,28px);font-size:15px;color:#8b96bf;letter-spacing:.1em;\">na {{ totalLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <h1 class=\"q-result-title\" style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;margin:26px 0 0;letter-spacing:-.02em;\">{{ resultTitle }}<\u002Fh1>\n        <p style=\"font-size:18px;color:#9aa6d4;margin:12px 0 0;max-width:460px;line-height:1.5;\">{{ resultSubtitle }}<\u002Fp>\n        <div style=\"display:flex;gap:9px;margin-top:26px;\">\n          <sc-for list=\"{{ recapList }}\" as=\"r\" hint-placeholder-count=\"10\">\n            <div style=\"{{ r.style }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;\">\n          <div style=\"display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:15px;font-weight:600;color:#cdd6f5;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4fd6ff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 9v4l2 2\"><\u002Fpath><path d=\"M9 2h6\"><\u002Fpath><\u002Fsvg>{{ finalTimeLabel }}<\u002Fdiv>\n          <div style=\"{{ submitStatusStyle }}\">{{ submitStatusText }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showRetry }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ submit }}\" style=\"margin-top:16px;padding:11px 26px;border-radius:999px;font-size:14px;font-weight:700;color:#eaf0ff;background:rgba(255,92,108,.14);border:1px solid rgba(255,92,108,.5);cursor:pointer;font-family:'Space Grotesk',sans-serif;\" style-hover=\"background:rgba(255,92,108,.24)\">Wyślij ponownie<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= QR MODAL ================= -->\n    <sc-if value=\"{{ showQr }}\" hint-placeholder-val=\"{{ false }}\">\n      <div onclick=\"{{ closeQr }}\" style=\"position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,20,.78);backdrop-filter:blur(6px);animation:fadein .25s ease;\">\n        <div onclick=\"{{ stop }}\" style=\"position:relative;max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 30px 30px;border-radius:22px;background:linear-gradient(160deg,#0c1838,#0a1130);border:1px solid rgba(120,180,255,.22);box-shadow:0 30px 80px -20px rgba(0,30,90,.8);\">\n          <button onclick=\"{{ closeQr }}\" aria-label=\"Zamknij\" style=\"position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);cursor:pointer;color:#cdd6f5;font-size:18px;\" style-hover=\"background:rgba(255,255,255,.15)\">✕<\u002Fbutton>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:#eaf0ff;\">Zeskanuj i zagraj<\u002Fdiv>\n          <div style=\"font-size:14px;color:#9aa6d4;margin-top:6px;line-height:1.45;\">Otwórz quiz na swoim telefonie<\u002Fdiv>\n          <div style=\"margin-top:22px;padding:14px;background:#fff;border-radius:16px;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);width:236px;height:236px;display:flex;align-items:center;justify-content:center;\">\n            <img ref=\"{{ qrImgRef }}\" alt=\"Kod QR\" style=\"display:block;width:208px;height:208px;image-rendering:pixelated;\">\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;font-size:13px;color:#7c89c4;word-break:break-all;line-height:1.4;\">{{ qrUrl }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= FOOTER ================= -->\n    <sc-if value=\"{{ showFooter }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:34px;display:flex;justify-content:center;\">\n        <button onclick=\"{{ openPrivacy }}\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;color:#8b96bf;background:transparent;border:1px solid rgba(255,255,255,.12);cursor:pointer;font-family:'Manrope',sans-serif;\" style-hover=\"color:#cdd6f5;border-color:rgba(255,255,255,.24)\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4fd6ff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg>Ochrona Twoich danych<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= PRIVACY MODAL ================= -->\n    <sc-if value=\"{{ showPrivacy }}\" hint-placeholder-val=\"{{ false }}\">\n      <div onclick=\"{{ closePrivacy }}\" style=\"position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,20,.8);backdrop-filter:blur(6px);animation:fadein .25s ease;\">\n        <div onclick=\"{{ stop }}\" style=\"position:relative;max-width:460px;width:100%;text-align:left;padding:34px 32px 30px;border-radius:22px;background:linear-gradient(160deg,#0c1838,#0a1130);border:1px solid rgba(120,180,255,.22);box-shadow:0 30px 80px -20px rgba(0,30,90,.8);\">\n          <button onclick=\"{{ closePrivacy }}\" aria-label=\"Zamknij\" style=\"position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);cursor:pointer;color:#cdd6f5;font-size:18px;\" style-hover=\"background:rgba(255,255,255,.15)\">✕<\u002Fbutton>\n          <div style=\"display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#eaf0ff;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4fd6ff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg>Ochrona Twoich danych<\u002Fdiv>\n          <div style=\"margin-top:18px;font-size:15px;line-height:1.62;color:#c4cdf0;\">Podany numer telefonu zostanie wykorzystany wyłącznie w celu wyłonienia zwycięzcy oraz przekazania nagrody.<\u002Fdiv>\n          <div style=\"margin-top:12px;font-size:15px;line-height:1.62;color:#c4cdf0;\">Po zakończeniu konkursu Twój numer zostanie trwale usunięty i nie będzie używany w żadnym innym celu.<\u002Fdiv>\n          <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;line-height:1.6;color:#8b96bf;\">Administratorem danych osobowych jest Bit By Bit Sp. z o.o., NIP 7822809748. Dane przetwarzane są na podstawie art. 6 ust. 1 lit. b RODO (realizacja konkursu).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen: 'start', current: 0, selections: {}, phone: '', phoneError: '', startTime: null, endTime: null, now: Date.now(), submitState: 'idle', submitError: '', showQr: false, showPrivacy: false };\n\n  USED_KEY = 'quiz_kosmiczny_used_phones';\n  isValidPhone(v) { const d = (v || '').replace(/[^\\d]/g, ''); return d.length >= 9 && d.length <= 15; }\n  normPhone(v) { return (v || '').replace(/[^\\d]/g, ''); }\n  usedPhones() { try { return JSON.parse(localStorage.getItem(this.USED_KEY) || '[]'); } catch (e) { return []; } }\n  markPhoneUsed(p) { try { const l = this.usedPhones(); if (!l.includes(p)) { l.push(p); localStorage.setItem(this.USED_KEY, JSON.stringify(l)); } } catch (e) {} }\n\n  quizUrl() {\n    try {\n      const loc = window.location;\n      if (loc && loc.protocol && loc.protocol.indexOf('http') === 0) return loc.href;\n    } catch (e) {}\n    return 'https://thebitbybit.com/';\n  }\n\n  openQr = () => this.setState({ showQr: true });\n  closeQr = () => this.setState({ showQr: false });\n  openPrivacy = () => this.setState({ showPrivacy: true });\n  closePrivacy = () => this.setState({ showPrivacy: false });\n  stop = (e) => { e.stopPropagation(); };\n\n  FORMSPREE_URL = 'https://formspree.io/f/mykaqzne';\n\n\n\n  formatTime(ms) {\n    if (!ms || ms < 0) ms = 0;\n    const s = Math.floor(ms / 1000);\n    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');\n  }\n\n  setPhone = (e) => this.setState({ phone: e.target.value, phoneError: '' });\n\n  submit = async () => {\n    if (this.state.submitState === 'sending' || this.state.submitState === 'sent') return;\n    const score = Object.keys(this.state.selections).reduce((n, k) => n + (this.state.selections[k] === this.questions[k].correct ? 1 : 0), 0);\n    const timeMs = (this.state.endTime || Date.now()) - (this.state.startTime || Date.now());\n    this.setState({ submitState: 'sending' });\n    try {\n      const res = await fetch(this.FORMSPREE_URL, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },\n        body: JSON.stringify({\n          telefon: this.state.phone.trim(),\n          quiz: 'Quiz kosmiczny ESA',\n          wynik_punkty: score,\n          wynik: score + ' / ' + this.questions.length,\n          czas: this.formatTime(timeMs),\n          czas_sekundy: Math.round(timeMs / 1000)\n        })\n      });\n      if (res.ok) this.setState({ submitState: 'sent' });\n      else this.setState({ submitState: 'error', submitError: 'HTTP ' + res.status });\n    } catch (err) {\n      this.setState({ submitState: 'error', submitError: String(err) });\n    }\n  };\n\n  questions = [\n    { q: 'Jak szybko porusza się Międzynarodowa Stacja Kosmiczna (ISS)?',\n      options: ['Około 1 km/s','Około 3 km/s','Około 7,7 km/s','Około 30 km/s'], correct: 2,\n      explain: 'ISS okrąża Ziemię z prędkością ok. 7,7 km/s — jedno pełne okrążenie zajmuje około 90 minut.' },\n    { q: 'Ile aktywnych satelitów znajduje się obecnie na niskiej orbicie okołoziemskiej (LEO)?',\n      options: ['Około 500','Około 2 000','Około 5 000','Ponad 10 000'], correct: 3,\n      explain: 'Na LEO działa już ponad 10 000 satelitów — to głównie wielkie konstelacje komunikacyjne.' },\n    { q: 'Czym zajmuje się misja satelitarna ESA „Swarm”?',\n      options: ['Badaniem atmosfery Marsa','Pomiarami pola magnetycznego Ziemi i jego zmian','Obserwacją powierzchni Księżyca w wysokiej rozdzielczości','Wykrywaniem śmieci kosmicznych na orbicie GEO'], correct: 1,\n      explain: 'Swarm to trójka satelitów ESA mierzących pole magnetyczne Ziemi i jego zmiany w czasie.' },\n    { q: 'Która z poniższych stacji naziemnych ESA znajduje się na Antarktydzie?',\n      options: ['Kiruna','Svalbard','Troll','Redu'], correct: 2,\n      explain: 'Stacja Troll leży na Antarktydzie, na Ziemi Królowej Maud.' },\n    { q: 'Która z poniższych stacji naziemnych ESA znajduje się najdalej na północ?',\n      options: ['Kiruna','Svalbard','Troll','Redu'], correct: 1,\n      explain: 'Stacja na Svalbardzie (ok. 78°N) jest najdalej na północ wysuniętą stacją naziemną ESA.' },\n    { q: 'Z którego kosmodromu ESA realizuje większość swoich startów rakiet nośnych?',\n      options: ['Baikonur','Kourou','Cape Canaveral','Andøya'], correct: 1,\n      explain: 'Większość startów ESA odbywa się z kosmodromu Kourou w Gujanie Francuskiej, blisko równika.' },\n    { q: 'Która rakieta jest obecnie podstawową ciężką rakietą nośną Europy?',\n      options: ['Falcon 9','Soyuz-2','Ariane 6','Electron'], correct: 2,\n      explain: 'Ariane 6 to obecna podstawowa ciężka rakieta nośna Europy.' },\n    { q: 'Jak nazywa się europejski system nawigacji satelitarnej?',\n      options: ['GPS','Galileo','Starlink','Copernicus'], correct: 1,\n      explain: 'Galileo to europejski system nawigacji satelitarnej — odpowiednik amerykańskiego GPS.' },\n    { q: 'Program Copernicus służy głównie do:',\n      options: ['komunikacji satelitarnej','obserwacji Ziemi','nawigacji satelitarnej','eksploracji Marsa'], correct: 1,\n      explain: 'Copernicus to europejski program obserwacji Ziemi — monitoruje m.in. klimat, lądy i oceany.' },\n    { q: 'Na jakiej orbicie znajdują się satelity geostacjonarne?',\n      options: ['Na orbicie polarnej na wysokości ok. 800 km','Na orbicie równikowej ok. 36 000 km','Na niskiej orbicie (LEO) ok. 400 km','Na średniej orbicie (MEO) ok. 20 000 km'], correct: 1,\n      explain: 'Satelity geostacjonarne krążą ok. 36 000 km nad równikiem, „wisząc” nad jednym punktem Ziemi.' },\n    { q: 'Jaki jest najstarszy satelita nadal wykonujący swoje zadanie na orbicie?',\n      options: ['Voyager 1','Lincoln Calibration Sphere','Kosmiczny Teleskop Hubble\\u2019a','ISS'], correct: 1,\n      explain: 'LCS-1 (Lincoln Calibration Sphere) z 1965 r. to metalowa kula kalibracyjna — wciąż służy do kalibracji radarów. Voyager 1 nie jest satelitą Ziemi.' },\n    { q: 'Jaki jest najgęstszy obiekt w Układzie Słonecznym?',\n      options: ['Słońce','Jowisz','Satelita LARES','Falcon 9'], correct: 2,\n      explain: 'Satelita LARES, wykonany z wolframu, ma największą znaną średnią gęstość spośród obiektów w Układzie Słonecznym — gęstszy niż jądra planet.' },\n    { q: 'Jaka jest najbliższa gwiazda (oprócz Słońca)?',\n      options: ['Alfa Centauri A','Proxima Centauri','Wega','Sagittarius A*'], correct: 1,\n      explain: 'Proxima Centauri, czerwony karzeł w układzie Alfa Centauri, leży ok. 4,24 roku świetlnego od nas — to najbliższa gwiazda poza Słońcem.' },\n    { q: 'W którym paśmie promieniowania najlepiej obserwować formowanie się nowych gwiazd?',\n      options: ['Ultrafioletowym','Rentgenowskim','Podczerwonym','W całym zakresie światła widzialnego'], correct: 2,\n      explain: 'Podczerwień przenika obłoki pyłu, w których rodzą się gwiazdy — dlatego teleskopy takie jak JWST obserwują je właśnie w podczerwieni.' },\n    { q: 'Ile jest planet karłowatych w Układzie Słonecznym?',\n      options: ['5','Około 650','1 (Pluton)','67'], correct: 0,\n      explain: 'Oficjalnie uznaje się 5 planet karłowatych: Ceres, Pluton, Haumea, Makemake i Eris (kandydatów jest znacznie więcej).' },\n    { q: 'Czym jest Gonggong?',\n      options: ['Obiekt transneptunowy','Chińska sonda kosmiczna','Prototypowy chiński łazik księżycowy','Radziecki silnik rakietowy z XX wieku'], correct: 0,\n      explain: 'Gonggong to duży obiekt transneptunowy krążący daleko za orbitą Neptuna — uznawany za kandydata na planetę karłowatą.' },\n    { q: 'Dlaczego niebo w nocy jest ciemne, skoro w kosmosie są miliardy gwiazd?',\n      options: ['Z powodu gęstej ziemskiej atmosfery','Z powodu ekspansji wszechświata i skończonej prędkości światła','Po prostu z powodu dużej odległości gwiazd','Z powodu zbyt słabej czułości naszego oka'], correct: 1,\n      explain: 'To paradoks Olbersa: wszechświat ma skończony wiek, a jego ekspansja sprawia, że światło najdalszych gwiazd albo do nas nie dotarło, albo zostało przesunięte poza zakres widzialny.' },\n    { q: 'Czy w kosmicznej próżni można usłyszeć utwór „Fly Me to the Moon” Franka Sinatry?',\n      options: ['Tak','Nie'], correct: 1,\n      explain: 'Nie — dźwięk to fala mechaniczna, która potrzebuje ośrodka (np. powietrza). W próżni kosmosu nie ma czego wprawić w drgania.' },\n    { q: 'Dlaczego niebo jest niebieskie?',\n      options: ['Dzięki rozpraszaniu światła słonecznego na cząsteczkach gazu w powietrzu','Bo próżnia emituje fale w kolorze niebieskim','Dzięki fotosyntezie roślin','Przez duże zanieczyszczenie powietrza'], correct: 0,\n      explain: 'Rozpraszanie Rayleigha: cząsteczki powietrza rozpraszają krótkie (niebieskie) fale światła silniej niż długie (czerwone), więc niebo widzimy na niebiesko.' },\n    { q: 'Gdzie znajduje się tzw. „Cmentarzysko statków kosmicznych”?',\n      options: ['Rów Mariański','Punkt Nemo na Pacyfiku','Trójkąt Bermudzki','Basen Arktyczny'], correct: 1,\n      explain: 'Point Nemo — najdalej oddalony od lądu punkt oceanu — to miejsce, w którym sprowadza się z orbity wycofane statki i stacje kosmiczne.' },\n    { q: 'Dlaczego na Merkurym, mimo bliskości Słońca, nocą temperatura spada do ok. -180°C?',\n      options: ['Bo obraca się stale tyłem do Słońca','Przez brak gęstej atmosfery, która zatrzymałaby ciepło','Przez bardzo wysokie albedo powierzchni','Z powodu silnego pola magnetycznego'], correct: 1,\n      explain: 'Merkury niemal nie ma atmosfery, więc ciepło z nasłonecznionej strony szybko ucieka w przestrzeń — stąd ekstremalna różnica między dniem a nocą.' },\n    { q: 'Jaki rodzaj napędu napędzał m.in. sondę Dawn i japońską misję Hayabusa?',\n      options: ['Napęd plazmowy','Żagiel słoneczny','Napęd jonowy','Termiczny napęd jądrowy'], correct: 2,\n      explain: 'Napęd jonowy rozpędza zjonizowany gaz (np. ksenon) polem elektrycznym. Daje mały, ale bardzo wydajny ciąg, utrzymywany przez długi czas.' },\n    { q: 'Kiedy wystrzelono pierwszego polskiego satelitę naukowego PW-Sat?',\n      options: ['2012','2009','2014','2017'], correct: 0,\n      explain: 'PW-Sat wystartował w 2012 r. jako pierwszy polski satelita — studencki CubeSat z Politechniki Warszawskiej.' },\n    { q: 'Który polski satelita jako pierwszy przetestował żagiel deorbitacyjny, mający przyspieszać spalanie się w atmosferze?',\n      options: ['PW-Sat2','Lem','KRAKsat','EagleEye'], correct: 0,\n      explain: 'PW-Sat2 (2018) rozłożył żagiel deorbitacyjny, który zwiększa opór atmosferyczny i skraca czas schodzenia satelity z orbity.' },\n    { q: 'Satelita PW-Sat1 był pierwszym polskim satelitą. Jaka była jego główna klasa (format)?',\n      options: ['CubeSat 2U','MicroSat','CubeSat','SmallSat'], correct: 0,\n      explain: 'PW-Sat1 to CubeSat w formacie 2U — dwa standardowe moduły 10×10×10 cm złożone w prostopadłościan 10×10×20 cm.' }\n  ];\n\n  componentDidMount() {\n    this._onKey = (e) => {\n      if (this.state.screen !== 'quiz') return;\n      if (e.key === 'ArrowLeft') { e.preventDefault(); this.goPrev(); }\n      else if (e.key === 'ArrowRight') { e.preventDefault(); this.goNext(); }\n      else if (['1','2','3','4'].includes(e.key)) { e.preventDefault(); this.select(+e.key - 1); }\n      else if (['a','b','c','d'].includes(e.key.toLowerCase())) { e.preventDefault(); this.select('abcd'.indexOf(e.key.toLowerCase())); }\n      else if (e.key === 'Enter') { e.preventDefault(); this.next(); }\n    };\n    this._onEsc = (e) => { if (e.key === 'Escape') { if (this.state.showQr) this.setState({ showQr: false }); if (this.state.showPrivacy) this.setState({ showPrivacy: false }); } };\n    window.addEventListener('keydown', this._onEsc);\n    window.addEventListener('keydown', this._onKey);\n    this._timer = setInterval(() => {\n      if (this.state.screen === 'quiz') this.setState({ now: Date.now() });\n    }, 1000);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._onKey); window.removeEventListener('keydown', this._onEsc); clearInterval(this._timer); }\n\n  start = () => {\n    if (!this.isValidPhone(this.state.phone)) { this.setState({ phoneError: 'Podaj poprawny numer telefonu (min. 9 cyfr).' }); return; }\n    const np = this.normPhone(this.state.phone);\n    if (this.usedPhones().includes(np)) { this.setState({ phoneError: 'Ten numer telefonu wziął już udział w quizie.' }); return; }\n    this.markPhoneUsed(np);\n    this.setState({ screen: 'quiz', current: 0, selections: {}, startTime: Date.now(), endTime: null, now: Date.now(), submitState: 'idle', submitError: '', phoneError: '' });\n  };\n\n  select = (i) => {\n    if (i < 0 || i >= this.questions[this.state.current].options.length) return;\n    if (this.state.selections[this.state.current] !== undefined) return;\n    this.setState(s => ({ selections: { ...s.selections, [s.current]: i } }));\n    clearTimeout(this._advance);\n    this._advance = setTimeout(() => this.next(), 420);\n  };\n\n  goPrev = () => this.setState(s => ({ current: Math.max(0, s.current - 1) }));\n  goNext = () => this.setState(s => ({ current: Math.min(this.questions.length - 1, s.current + 1) }));\n\n  next = () => {\n    clearTimeout(this._advance);\n    if (this.state.current < this.questions.length - 1) {\n      this.setState(s => ({ current: s.current + 1 }));\n    } else {\n      this.setState({ screen: 'result', endTime: Date.now() }, () => this.submit());\n    }\n  };\n\n  renderVals() {\n    const { screen, current, selections, phone, phoneError, startTime, endTime, now, submitState, showQr, showPrivacy } = this.state;\n\n    const qrUrl = this.quizUrl();\n    let qrDataUrl = '';\n    if (showQr && typeof window.qrcode === 'function') {\n      try {\n        const qr = window.qrcode(0, 'M');\n        qr.addData(qrUrl);\n        qr.make();\n        qrDataUrl = qr.createDataURL(8, 16);\n      } catch (e) {}\n    }\n    this._qrData = qrDataUrl;\n    const q = this.questions[current];\n    const total = this.questions.length;\n    const letters = ['A','B','C','D'];\n    const selected = selections[current] === undefined ? null : selections[current];\n    const answered = selected !== null;\n    const score = Object.keys(selections).reduce((n, k) => n + (selections[k] === this.questions[k].correct ? 1 : 0), 0);\n\n    const optionList = q.options.map((text, i) => {\n      let boxBg = 'rgba(255,255,255,.04)', border = '1px solid rgba(255,255,255,.12)',\n          chipBg = 'rgba(255,255,255,.09)', chipColor = '#aeb9e6', opacity = 1,\n          markChar = '', markColor = 'transparent';\n      if (answered) {\n        if (i === selected) { boxBg = 'rgba(79,214,255,.16)'; border = '1px solid rgba(79,214,255,.7)'; chipBg = '#4fd6ff'; chipColor = '#04223a'; }\n        else { opacity = .45; }\n      }\n      return {\n        text, letter: letters[i], markChar,\n        boxStyle: `display:flex;align-items:center;gap:15px;padding:18px 20px;border-radius:14px;background:${boxBg};border:${border};opacity:${opacity};cursor:${answered ? 'default' : 'pointer'};transition:all .22s ease;width:100%;text-align:left;color:#eaf0ff;`,\n        chipStyle: `flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;font-family:'Space Grotesk',sans-serif;background:${chipBg};color:${chipColor};transition:all .22s ease;`,\n        markStyle: `margin-left:auto;font-size:21px;font-weight:700;color:${markColor};`,\n        onClick: answered ? null : () => this.select(i)\n      };\n    });\n\n    const dotList = Array.from({ length: total }, (_, i) => {\n      let style;\n      if (i === current) style = 'flex:none;width:16px;height:5px;border-radius:3px;background:#4fd6ff;box-shadow:0 0 8px rgba(79,214,255,.7);transition:all .3s;';\n      else if (i < current) style = 'flex:none;width:5px;height:5px;border-radius:50%;background:#4fd6ff;opacity:.65;transition:all .3s;';\n      else style = 'flex:none;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .3s;';\n      return { style };\n    });\n\n    const recapList = Object.keys(selections).map(k => +k).sort((a, b) => a - b).map(i => {\n      const ok = selections[i] === this.questions[i].correct;\n      return { style: `width:18px;height:18px;border-radius:5px;background:${ok ? 'rgba(47,208,131,.85)' : 'rgba(255,92,108,.8)'};box-shadow:0 0 8px ${ok ? 'rgba(47,208,131,.5)' : 'rgba(255,92,108,.4)'};` };\n    });\n\n    const wasCorrect = selected === q.correct;\n    const feedbackTitle = wasCorrect ? 'Zgadza się!' : 'Niezupełnie';\n    const feedbackBody = wasCorrect ? q.explain : 'To nie ta odpowiedź. Przejdź do kolejnego pytania.';\n    const feedbackStyle = `margin-top:16px;padding:16px 20px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-left:4px solid ${wasCorrect ? '#2fd083' : '#ff5c6c'};animation:fadein .35s ease;`;\n\n    const pct = total > 0 ? score / total : 0;\n    let resultTitle, resultSubtitle;\n    if (pct >= 0.9) { resultTitle = 'Wynik kosmiczny!'; resultSubtitle = 'Niemal nic nie umknęło Twojej uwadze — orbitujesz na poziomie eksperta.'; }\n    else if (pct >= 0.7) { resultTitle = 'Świetna orbita!'; resultSubtitle = 'Bardzo dobry wynik — solidnie znasz kosmos i europejski program kosmiczny.'; }\n    else if (pct >= 0.5) { resultTitle = 'Dobry kurs.'; resultSubtitle = 'Połowa za Tobą — jeszcze trochę i osiągniesz orbitę docelową.'; }\n    else if (pct >= 0.3) { resultTitle = 'Jeszcze trochę paliwa.'; resultSubtitle = 'Jest na czym budować — kosmos kryje jeszcze wiele tajemnic.'; }\n    else { resultTitle = 'Start nieidealny.'; resultSubtitle = 'Nie szkodzi — każdy lot zaczyna się od próby.'; }\n\n    const ringOffset = 440 * (1 - score / total);\n\n    const arrowBase = 'position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,18,46,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);transition:all .2s;z-index:5;';\n    const prevDisabled = current === 0;\n    const nextDisabled = current === total - 1;\n    const prevStyle = arrowBase + `left:14px;cursor:${prevDisabled ? 'default' : 'pointer'};opacity:${prevDisabled ? .3 : 1};`;\n    const nextStyle = arrowBase + `right:14px;cursor:${nextDisabled ? 'default' : 'pointer'};opacity:${nextDisabled ? .3 : 1};`;\n\n    const canStart = this.isValidPhone(phone);\n    const startBtnBase = \"margin-top:26px;display:inline-flex;align-items:center;gap:12px;padding:18px 40px;border-radius:999px;font-size:18px;font-weight:700;font-family:'Space Grotesk',sans-serif;transition:all .2s;\";\n    const startBtnStyle = canStart\n      ? startBtnBase + 'color:#05122e;background:linear-gradient(135deg,#7fe3ff,#3aa0ff);box-shadow:0 16px 40px -12px rgba(79,160,255,.8);cursor:pointer;'\n      : startBtnBase + 'color:#6b76a6;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);cursor:not-allowed;';\n\n    const elapsedMs = (screen === 'quiz' && startTime) ? (now - startTime) : 0;\n    const timeLabel = this.formatTime(elapsedMs);\n    const finalTimeLabel = this.formatTime((endTime || 0) - (startTime || 0));\n\n    let submitStatusText = '', sc1 = '#cdd6f5', sb = 'rgba(255,255,255,.06)', sbd = 'rgba(255,255,255,.14)';\n    if (submitState === 'sending') { submitStatusText = 'Wysyłanie wyniku…'; }\n    else if (submitState === 'sent') { submitStatusText = 'Wynik zapisany ✓'; sc1 = '#2fd083'; sb = 'rgba(47,208,131,.12)'; sbd = 'rgba(47,208,131,.5)'; }\n    else if (submitState === 'error') { submitStatusText = 'Nie udało się wysłać — spróbuj ponownie'; sc1 = '#ff8a94'; sb = 'rgba(255,92,108,.12)'; sbd = 'rgba(255,92,108,.5)'; }\n    const submitStatusStyle = `display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;color:${sc1};background:${sb};border:1px solid ${sbd};`;\n\n    const isQ = screen === 'quiz';\n    const sceneFlags = {};\n    for (let i = 0; i < total; i++) sceneFlags['q' + i] = isQ && current === i;\n\n    return {\n      isStart: screen === 'start',\n      isQuiz: isQ,\n      isResult: screen === 'result',\n      ...sceneFlags,\n      counter: String(current + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0'),\n      question: q.q,\n      optionList, dotList, recapList,\n      answered,\n      feedbackTitle, feedbackText: feedbackBody, feedbackStyle,\n      nextLabel: current < total - 1 ? 'Następne pytanie' : 'Zobacz wynik',\n      score, totalLabel: String(total), resultTitle, resultSubtitle, ringOffset,\n      prevStyle, nextStyle, goPrev: prevDisabled ? null : this.goPrev, goNext: nextDisabled ? null : this.goNext,\n      setPhone: this.setPhone, canStart, startBtnStyle, phoneError,\n      showQr, qrUrl, openQr: this.openQr, closeQr: this.closeQr, stop: this.stop,\n      showPrivacy, openPrivacy: this.openPrivacy, closePrivacy: this.closePrivacy,\n      showFooter: screen === 'start' || screen === 'quiz',\n      qrImgRef: (el) => { if (el && this._qrData) el.src = this._qrData; },\n      timeLabel, finalTimeLabel,\n      submitStatusText, submitStatusStyle, showRetry: submitState === 'error', submit: this.submit,\n      start: this.start, next: this.next\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
